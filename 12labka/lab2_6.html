<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>Завдання 6. WHILE (Гра). Врублевська К., ПП-22 (ЛР №12)</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Лабораторна робота №12. Завдання 6</h1>
    </header>
    <div class="container">
        <h2>Оператор циклу WHILE: Гра "Вгадай число" (5 спроб)</h2>
        <p>Скрипт пропонує вгадати число від 1 до 100. У вас є лише 5 спроб!</p>
        <button onclick="startGame()">Розпочати гру</button>

        <script>
            "use strict";

            function startGame() {
                // Генерація випадкового числа від 1 до 100
                const targetNumber = Math.floor(Math.random() * 100) + 1;
                let userGuess;
                let attempts = 0;
                const maxAttempts = 5;
                let isGuessed = false;

                alert("Гра 'Вгадай число' розпочата! Я загадав число від 1 до 100. У вас є 5 спроб.");

                // Цикл WHILE з умовою: поки число не вгадане І кількість спроб менша за максимум
                while (!isGuessed && attempts < maxAttempts) {
                    attempts++;

                    const promptText = `Спроба ${attempts} з ${maxAttempts}. Введіть ваше число:`;
                    const input = prompt(promptText);

                    // Перевірка скасування (Cancel)
                    if (input === null) {
                        alert("Гру скасовано. Загадане число було: " + targetNumber);
                        return;
                    }

                    userGuess = parseInt(input);

                    // Перевірка коректності введення
                    if (isNaN(userGuess) || userGuess < 1 || userGuess > 100) {
                        alert("Будь ласка, введіть коректне число від 1 до 100.");
                        attempts--; // Не рахуємо цю спробу
                        continue; // Переходимо до наступної ітерації
                    }

                    // Основна логіка гри
                    if (userGuess === targetNumber) {
                        isGuessed = true; // Змінюємо умову для виходу з циклу
                        alert(`🎉 Вітаємо! Ви вгадали число ${targetNumber} за ${attempts} спроб.`);
                    } else if (userGuess < targetNumber) {
                        alert("Загадане число БІЛЬШЕ. Спробуйте знову.");
                    } else {
                        alert("Загадане число МЕНШЕ. Спробуйте знову.");
                    }
                }

                // Перевірка результату після виходу з циклу
                if (!isGuessed) {
                    alert(`😔 Ви вичерпали всі ${maxAttempts} спроб. Загадане число було: ${targetNumber}.`);
                }
            }
        </script>
    </div>
</body>

</html>
