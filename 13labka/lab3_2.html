<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>Завдання 2. Вбудовані функції (Date). Врублевська К., ПП-22 (ЛР №13)</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <h1>Лабораторна робота №13. Завдання 2</h1>
    </header>
    <div class="container">
        <h2>Вбудовані функції (Date): Розрахунок днів до Нового року</h2>

        <div class="script-output" id="output">
            <h3>До Нового Року залишилось:</h3>
            <p id="countdown-output"></p>
            <script>
                "use strict";

                const MS_PER_DAY = 1000 * 60 * 60 * 24;
                const now = new Date();
                const nextYear = now.getFullYear() + 1;
                const newYearDate = new Date(nextYear, 0, 1);
                const timeDifference = newYearDate.getTime() - now.getTime();
                const daysLeft = Math.ceil(timeDifference / MS_PER_DAY);

                let message;
                if (daysLeft === 0) {
                    message = "Сьогодні Новий Рік! 🎉";
                } else if (daysLeft > 0) {
                    message = `До 1 січня ${nextYear} залишилось: <strong>${daysLeft}</strong> повних днів.`;
                } else {
                    message = "Помилка дати (мабуть, ви вже святкуєте).";
                }

                document.getElementById('countdown-output').innerHTML = message;
            </script>
        </div>
    </div>
</body>

</html>
